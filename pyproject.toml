[project]
name = "squawk-atc"
version = "0.0.0"
description = "Faithful resumable mirror + merge for paired ATC-audio / ADS-B datasets"
authors = [{ name = "James Ding", email = "james@twango.dev" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
keywords = ["atc", "ads-b", "adsb", "asr", "speech", "aviation", "dataset", "tartanaviation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "httpx>=0.27",
  "typer>=0.12",
  "filelock>=3.13",
  "pyarrow>=16",
  "soundfile>=0.12",
  "soxr>=0.5",
]

[project.scripts]
squawk = "squawk.cli:app"

[project.urls]
Homepage = "https://github.com/twangodev/squawk"
Repository = "https://github.com/twangodev/squawk"
Issues = "https://github.com/twangodev/squawk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squawk"]

[dependency-groups]
dev = [
  "poethepoet>=0.32",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.14",
  "ty>=0.0.2",
  "respx>=0.21",
  "pytest-httpserver>=1.1",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["tests/"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["F", "W", "E", "I", "UP", "C4", "FA", "ISC", "ICN", "RET", "SIM", "TID", "TC", "PTH"]
ignore = ["E501", "TC001", "TC002", "TC003"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format --check ."
typecheck = "ty check"
check = ["lint", "format", "typecheck"]
lint-fix = "ruff check --fix ."
format-fix = "ruff format ."
fix = ["lint-fix", "format-fix"]
test = "pytest tests/ -v --cov=src/squawk --cov-report=term"
test-net = "pytest tests/ -v -m network"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = [
  "slow: real network / large IO",
  "network: hits the live CMU endpoint",
]
